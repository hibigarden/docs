</style></head><body><div id="root"></div><script id="workspace-data" type="application/json">{"name":"hibi 2","pages":[{"path":"docs/development/addons.md","markdown":"# creating addons\n\nhibi uses source-defined addons, similar to vencord’s plugin structure. addons are compiled with the app and enabled in settings. they are trusted application code, not sandboxed packages discovered in a document workspace.\n\n## layout\n\nput bundled addons in `src/addons/\u003cid>/`, or private addons in the git-ignored `src/useraddons/\u003cid>/`:\n\n```text\nmanifest.ts   metadata and api version\nindex.ts     renderer entry point\nnative.ts    optional native methods\nREADME.md    addon documentation\n```\n\nvite discovers these folders. add files and rebuild, or use `npm start` while developing. a renderer addon uses browser APIs; filesystem work belongs in its native entry point.\n\n## renderer entry\n\n```typescript\nimport { defineAddon } from '../api'\nimport manifest from './manifest'\n\nexport default defineAddon({\n  manifest,\n  start(context) {\n    context.commands.register({\n      id: 'hello',\n      label: 'hello from my addon',\n      run: () => context.notify('hello'),\n    })\n  },\n  stop() {\n    // Clean up any subscriptions or resources created by start.\n  },\n})\n```\n\nprivate addons import the SDK from `../../addons/api`. use a unique lowercase id containing letters, numbers, or hyphens. commands receive an automatic `\u003caddon-id>.` prefix. the host unregisters commands when an addon stops; addons must clean up their own event listeners and timers in `stop`.\n\n`context.workspace` opens or reads the selected workspace. `context.native.invoke` can call only that addon’s exported native methods. errors are shown in the app. native methods receive input as `unknown` and must validate their own arguments.\n\n## native entry\n\nexport a `NativeAddon` with an id and a map of asynchronous methods. `context.workspace.snapshot()` returns markdown pages with relative paths. `context.exportHtml()` asks the user where to save and writes the HTML there. never register a generic filesystem or arbitrary IPC dispatcher.\n\nthe working implementation lives in `src/addons/documentation/`. see [exporting documentation](../guides/exporting.md) for its behavior and [the generated API reference](../reference/addon-api.md) for exact signatures.\n\n## markdown extensions\n\nan extension can provide an optional React `Editor` component above the rich document. it receives the complete Markdown as `value`, an `onChange(source)` callback, and `disabled`. return `null` for notes where the UI does not apply. use the callback to keep both editor panes synchronized; honor `disabled` during file operations. the component unmounts when its addon is disabled.\n\ncommands may call `context.editor.updateMarkdown(transform)` to synchronously transform the latest note. this marks changes unsaved and rebuilds editor state; it throws while a file operation is running. use this for explicit commands, and use the component callback for ongoing field edits. existing addons remain compatible with API version 1.\n\n`context.editor.registerMarkdown` registers a pure `parse(source)` projection with a local id. return `null` for unrecognized documents, or `{ content, serialize }` to expose a visual-editing body and reconstruct the complete source after an edit. `readOnly: true` can protect unsupported variants. projections compose in registration order; serialization runs in reverse order.\n\nthe host removes registrations when the addon stops, preserves source text while editor capabilities change, and isolates parser errors with a read-only fallback. changing editor extensions rebuilds the visual editor, so its undo history resets; the current document stays intact. keep metadata untouched in `serialize` and avoid side effects in parser callbacks. `src/addons/frontmatter/` is the working example.\n\n## shared navigation\n\nimport `Sidebar` from the UI SDK at `src/addons/ui.ts`. it supports nested tree navigation or a flat tab list, optional headers/footers, keyboard focus, and a sliding selected background. hibi settings, the workspace picker, and exported documentation use this same implementation.\n\nthe optional `resize` prop adds the shared pointer and keyboard resize handle. pass the current width, maximum width, change callback, and reset callback, and apply that width to `--sidebar-width` on the containing layout. core desktop and static-site layouts share the internal `useSidebarResize` controller for clamping and local persistence.\n\n## compatibility\n\nthe public API is version 1. manifests declare `apiVersion`; incompatible manifests are rejected. preserve existing signatures when adding capabilities. breaking changes require an API version bump, addon migration, and documentation updates.\n\n`npm start` regenerates API references when their source declarations change. outside watch mode, run `npm run docs` after changing public types. `npm run docs:check`, included in `npm run check`, fails if generated references differ from the actual SDK or shared types. keep your addon’s README updated with behavior changes.\n","images":{}},{"path":"docs/development/architecture.md","markdown":"# architecture and security\n\n- `src/main`: native window lifecycle, guarded IPC, document IO, workspace access, and native addon hosting.\n- `src/preload`: a narrow typed bridge. it exposes no generic IPC, filesystem, or node APIs.\n- `src/renderer`: editor state and views, settings, command palette, and renderer addon hosting.\n- `src/ui`: shared controls, shortcut keycaps, design tokens, and sidebar used by settings, workspace navigation, and the exported site.\n- `src/addons`: versioned SDK and bundled addons. private addons live in `src/useraddons`.\n- `src/site`: read-only static documentation viewer; it does not use the Electron bridge.\n- `scripts`: site-template builds and generated documentation checks.\n\nthe main process checks sender identity, main-frame identity, and the exact app URL for every privileged operation. file dialogs grant paths; workspace calls accept only relative markdown paths inside the selected canonical folder. native addon calls require an enabled addon and an explicitly registered method.\n\nlocal image requests are bound to the current document revision. main resolves relative references from its native path, bounds reads to 8 mib, and checks image content before returning an image data URL. the bridge cannot return arbitrary file contents. documentation snapshots embed the same validated images.\n\ndocument replacement, exports, and addon preference writes share an operation guard. closing the app waits for the active operation and confirms unsaved edits. the workspace watcher is debounced and uses asynchronous IO.\n\nthe renderer is sandboxed and isolated, with no node integration. app assets use a traversal-checked local protocol. external navigation, child windows, downloads, and permissions are denied. development connects only to its local Vite server.\n\nstatic exports embed their data as escaped JSON, sanitize rendered markdown with DOMPurify, and permit only a hashed application script. bundled fonts and CSS need no external service. addon code is trusted at build time; a workspace never causes JavaScript to be loaded as an addon.\n","images":{}},{"path":"docs/development/design-system.md","markdown":"# shared ui and theme tokens\n\ndesktop and exported documentation use the same `src/ui/tokens.css`. its [generated reference](../reference/theme-tokens.md) is checked by `npm run docs:check`.\n\n## semantic colors\n\n`--background`, `--surface`, `--ink`, `--muted`, `--accent`, `--border`, and `--overlay` describe roles. light and dark defaults live together. components consume these roles instead of defining their own palette.\n\ntheme styles can override these variables on a root selector with greater specificity, such as `:root[data-theme=\"custom\"]`. keep foreground/background contrast readable. a theme picker and theme-file loading are not implemented yet; Electron's native window controls still follow the system appearance.\n\n## shared measurements\n\nUI fonts, type sizes, spacing, control/panel radii, icon size, and motion durations use tokens. durations use milliseconds; the editor's text-fade animation reads `--motion-feedback` too. document typography, pane geometry, and user-selected padding/sidebar width remain separate from UI decoration. reduced-motion preferences override animations.\n\n## shortcuts\n\nuse `ShortcutKeys` from `src/addons/ui.ts` in addons, or `src/ui/ShortcutKeys.tsx` in core UI. it uses the shared shortcut formatter and keycap styles in every surface: title bar, command rows, hotkey bindings, palette footer, and exported search. pass the effective binding and platform; do not render a separate `kbd` or hard-code a modifier symbol.\n\n`--key-height`, `--key-min-width`, `--key-radius`, `--key-background`, `--key-ink`, and `--key-border` control all shortcut hints together. text tooltips also use the shared formatter. exported documentation always uses its own cmd/ctrl+k binding.\n\n## settings\n\ngroup related rows on one surface with inset separators. each row puts its label and description on the left and its control on the right. controls wrap inside narrow panels, including when the sidebar is widened. keep native input semantics, labels, descriptions, and keyboard focus behavior.\n\n## reusable components\n\n- `Sidebar`: settings categories, workspace tree, and exported navigation share row height, selection motion, focus behavior, and resize controls.\n- `SettingRow`: padding, cursor, line-number, window, and addon settings share label/description layout and spacing.\n- `Toggle`: native checkbox semantics with one switch style for all settings.\n- `IconButton`: file/view controls, find navigation, workspace actions, palette close, notification close, hotkey actions, and exported navigation share size, radius, and icon stroke.\n- `ShortcutKeys`: every visible shortcut uses the same formatter and keycap styles.\n\nthese components are exported from `src/addons/ui.ts`. use them for new UI instead of copying their markup. grouped panels, input/select controls, notifications, and focus/hover states use the same semantic token values. short file operations mark the toolbar busy without flashing its icons.\n","images":{}},{"path":"docs/development/validation.md","markdown":"# development and validation\n\nuse node 24 lts, or node 22.18 or newer. install dependencies with `npm ci`.\n\n```sh\nnpm start           # app and static exporter template watch mode\nnpm run preview     # last production build\nnpm run docs        # refresh generated API references\nnpm run docs:check  # reject stale references\nnpm run check       # lint, API docs, typecheck, builds, native tests\nnpm run package     # unpacked local application\n```\n\nReact and CSS edits update in place. main/preload changes restart the development process; save working notes before changing native code. the dev profile is separate from packaged app data. the exporter template watches its shared UI dependencies, and generated API references update when their source declarations change.\n\nVite can replace its initial navigation when optimizing a newly added dependency. development treats that aborted navigation as a reload, so it does not close the app.\n\ntests use temporary profiles and real Electron windows. file dialogs are controlled against temporary fixtures. validation covers draft preservation, file writes, workspace traversal and nested navigation, local image resolution and offline embedding, frontmatter fields and YAML preservation, addon enable/disable, export sanitization, offline search and deep links, keyboard behavior, reduced motion, and pane geometry.\n\npublic SDK and sidebar references are generated from their real TypeScript declarations. update prose guides whenever behavior changes. release builds must pass `npm run check`; platform signing and notarization are separate distribution steps.\n","images":{}},{"path":"docs/guides/editing.md","markdown":"# editing\n\ntyping closes the workspace sidebar when no folder is open. an open workspace keeps its navigation visible. use the sidebar toggle to reopen the empty sidebar whenever needed.\n\n## images\n\nnormal and split views resolve relative image paths from the saved note's folder. absolute paths and local `file:` URLs also work. spaces can be percent encoded or enclosed in Markdown angle brackets. the stored Markdown keeps the original path.\n\nlocal PNG, JPEG, GIF, WebP, AVIF, and SVG images are supported up to 8 mib each. save a new note before using relative paths. unavailable images retain their alt text and a path hint. remote images are not fetched. SVGs display as images, never as executable document markup.\n\ndocumentation exports embed local Markdown images into the HTML, so they remain visible offline. the export limit is 20 mib including embedded image data.\n\n## frontmatter properties\n\nthe frontmatter addon adds collapsible metadata fields to normal and split views. edit text, numbers, and booleans directly; add or remove properties from the same panel. use **yaml** for lists, objects, and other YAML structures, then **apply yaml**. invalid YAML cannot overwrite the note. the body stays unchanged when properties change.\n\nuse **add frontmatter** in the command palette for a note without metadata. disable the addon under settings → addons to return to editing metadata in markdown only. see the [addon guide](frontmatter.md) for preservation details.\n\nsuccess and error notifications appear at the bottom right without moving your document. use the close button to dismiss them.\n\nstart typing in a blank document. normal view is the rich-text editor; side-by-side puts markdown on the left and rich text on the right; markdown-only edits the original source. click the filename to rename it. the separate command-palette control shows its current shortcut, with draggable space between controls.\n\nview switches use a quick text fade: content fades out, reflows once while hidden, then fades back in as the panes slide. the divider fades independently as split view opens or closes. the markdown engine prepares during idle time and waits for its font and layout before appearing. reduced-motion preferences disable animations.\n\ndefault view shortcuts are `cmd/ctrl+[` for normal, `cmd/ctrl+]` for markdown, and `cmd/ctrl+|` (`cmd/ctrl+shift+\\`) for side-by-side. these can be rebound in settings.\n\n## finding text\n\n`cmd/ctrl+f` opens find in note. enter advances; shift+enter goes back; escape closes. search is literal and case-insensitive. in side-by-side it searches the last focused pane, including offscreen markdown. the input width animates as the match count changes.\n\n## commands and settings\n\n`cmd/ctrl+k` opens the command palette. search, use arrow keys, and press enter. drag its non-interactive chrome to move the window; inputs and command rows remain interactive.\n\nclick outside the palette or press escape to dismiss it. shortcut hints use the same keycaps throughout the app and exported documentation.\n\nsettings contains editor, appearance, hotkeys, addons, and about. padding defaults to 48 px and can be changed from 0–96 px. the top bar can fade while typing. hotkeys can be rebound, cleared, or reset; conflicts and standard editing/window shortcuts are rejected. all command hints use the active bindings.\n\nsettings → editor → **show line numbers** toggles the markdown gutter in markdown-only and side-by-side views. it is hidden by default, saves on this device, and changes without resetting the document or undo history.\n\nappearance also controls the text cursor in both editors: line, outline block, filled block, or underline; fast, normal, or slow blinking; and smooth or blink animation. smooth slides between insertion positions and fades softly. blink moves immediately and switches on/off. cursor preferences persist locally. reduced motion disables sliding and blinking; native caret behavior is retained during composition or when custom geometry is unavailable.\n\n## saving\n\nclick the filename, enter a new name, and press enter. escape or clicking away cancels. names without an extension receive `.md`. renaming an unsaved document sets its suggested save name; existing files are renamed in the same folder without replacing another file. unsaved edits remain pending after a rename.\n\nnew, open, save, and save as use native dialogs. hibi checks for unsaved edits before replacing a document, and checks disk changes before overwriting the same file. saves write and sync a temporary file before renaming it over the destination.\n\nsource switching preserves original markdown. rich edits may normalize markdown syntax. the [frontmatter addon](frontmatter.md) preserves metadata while allowing visual body edits. raw html, reference definitions, and frontmatter without its enabled addon stay editable in source mode; their rich preview is read-only, without a banner. local images display without rewriting their Markdown references.\n\ndocuments are UTF-8 and limited to 2 mib. drafts are held in memory; renderer reloads recover them from the main process, but a full process or machine crash can lose unsaved edits.\n","images":{}},{"path":"docs/guides/exporting.md","markdown":"# exporting documentation\n\n## navigation and small screens\n\nbreadcrumbs live in the top bar, with links back to the workspace and parent folders. previous and next page links sit below the document, separated by a divider, and follow sidebar order.\n\nheadings appear in an **in this page** outline on the right when there is room. on smaller screens the outline becomes a disclosure above the document; choosing a heading closes it and scrolls to that section. the current section is highlighted while scrolling.\n\non phones, workspace navigation opens over the document with a dismissible backdrop. choosing a page, tapping outside, or pressing escape closes it. entering the phone layout also closes an open sidebar. header breadcrumbs shorten, content padding decreases, tables and code scroll within their own area, and the rest of the page keeps its width.\n\nphone navigation rows and header controls use 44px touch targets. the shared sidebar selection follows the same row-height token, so its sliding highlight stays aligned at both densities.\n\n## export a folder\n\n1. keep documentation in markdown files inside a folder. nested folders are supported.\n2. open that folder as a workspace.\n3. enable **documentation** in settings → addons.\n4. choose **export documentation** below the file tree or in the command palette.\n5. save the generated `.html` file.\n\nupload that file to any static host, usually as `index.html`. it also opens directly from disk. no server, account, build step, search service, or network request is needed to read it.\n\n## included\n\n- normal read-only markdown rendering; no editor or source-view controls.\n- the shared full-height nested sidebar, with a smooth slide from the left.\n- `cmd/ctrl+k` search with fuzzy matching, prefix matches, and keyword relevance. titles and paths receive extra weight. this is local text search, not an embedding model.\n- hash-based document and heading links, browser history, light/dark themes, bundled geist fonts, and reduced-motion support.\n\nrelative links between included markdown pages are rewritten for the exported site. `README.md` or `index.md` at the root is the initial page when present. the current document’s in-memory edits are included if it belongs to the workspace; exporting does not silently save those edits back to the original file.\n\nexports support up to 2,000 documents and 20 mib of markdown and embedded images. the export contains every included markdown file and its local Markdown images, so review the selected folder before publishing. hidden documents, symlinked documents, and `node_modules` are excluded.\n\n## boundaries\n\nraw html is sanitized. scripts, forms, event handlers, and dangerous URLs are removed. a restrictive content security policy blocks network requests and unapproved scripts.\n\nlocal Markdown images are embedded in the HTML, including relative paths, absolute paths, and local `file:` URLs. each image must be PNG, JPEG, GIF, WebP, AVIF, or SVG and no larger than 8 mib. relative paths resolve from each note's folder. missing or unsupported images retain their alt text. remote images are not fetched. links to non-markdown files are disabled unless they are explicit external web/mail links.\n","images":{}},{"path":"docs/guides/frontmatter.md","markdown":"# frontmatter\n\nfrontmatter is a bundled addon, enabled by default under settings → addons. it recognizes a YAML block at the beginning of a document, opened with `---` and closed with `---` or `...`.\n\nnormal and split views show a collapsible properties editor above the body. text, multiline text, numbers, and booleans have fields; lists and objects open in the yaml editor. add a property by name and type, or remove one from its row. **add frontmatter** in the command palette creates a metadata block on a note without one.\n\nthe editor uses compact page metadata rows with type icons, inline values, and tags for simple lists. property actions appear on hover or keyboard focus. **add property** opens the name and type inputs.\n\nfield edits apply immediately. raw yaml edits require **apply yaml**, which validates syntax before changing the document. **cancel** discards the yaml draft. if metadata changes in markdown view while a yaml draft is open, reopen the yaml editor to use the latest values.\n\nbody edits preserve metadata verbatim. metadata edits retain the body, delimiters, line endings, and surrounding spacing. field edits retain comments, anchors, and value types, but may normalize YAML formatting. markdown view always contains the whole file.\n\ndisabling the addon preserves the file and restores source-only editing for metadata-bearing documents. unclosed metadata and unsupported body syntax remain protected from lossy visual edits. there is no compatibility banner.\n\nstatic documentation exports retain the original markdown; metadata values are not used as search or navigation configuration. the properties editor runs only inside the desktop addon.\n","images":{}},{"path":"docs/guides/workspaces.md","markdown":"# workspaces\n\nuse **open a folder…** in the left sidebar, the folder button, or **open workspace…** in the command palette. a workspace is an ordinary local folder. hibi creates no project format and does not move your files.\n\nbefore a folder is open, the sidebar centers a folder icon above **open a folder**. opening a workspace replaces this entry with the file tree and folder controls.\n\nthe tree shows `.md` and `.markdown` files, including nested folders. folder rows expand and collapse. arrow keys move focus; right/left expand or collapse folders; enter opens a file. the highlight slides to the current document and stays visible under the pointer.\n\nopening a folder leaves the current note intact. opening a file checks unsaved changes first. saving a new note starts the save dialog in the selected workspace. create nested folders using the native save dialog or your file manager; the tree watches filesystem changes and also has a refresh button.\n\ndotfiles, dotfolders, `node_modules`, and symlinks are excluded. hibi checks canonical paths before reading workspace files. very large folder scans stop at 20,000 entries; choose a smaller documentation folder when that limit is reached.\n\nthe sidebar button hides or shows navigation with a short slide from the left. labels retain their width during motion; reduced-motion preferences disable transitions. settings, workspaces, and exported sites use the same sidebar component and keyboard behavior.\n\nwith navigation visible, window controls sit over the sidebar and document controls begin beside it. hiding navigation brings the top bar together. settings keeps its category sidebar and hides document-only actions.\n\nthe sidebar paints one continuous surface behind the window controls, so its top and body move together when opening and closing.\n\ndocument content moves with the sidebar in the editor and exported site. it resizes once per toggle, then animates horizontally without rewrapping each frame. narrow exported pages keep the sidebar above the document.\n\ndrag the sidebar's right edge to resize it. the desktop app shares the chosen width between workspace and settings; exported sites remember their own width in browser storage. widths range from 152 to 480 pixels, limited by available window space. resizing still works when browser storage is unavailable.\n\nfocus the resize edge and use left/right arrows (8 pixels, or 24 with shift), home/end for the limits, and enter to reset. double-click also restores the default width; escape cancels an active drag.\n","images":{}},{"path":"docs/reference/addon-api.md","markdown":"# addon api\n\ngenerated from `src/addons/api.ts`. update the source, then run `npm run docs`. `npm run docs:check` rejects stale references.\n\n```typescript\nimport type { Extension } from '@codemirror/state'\nimport type { ComponentType } from 'react'\nimport type { DocumentCommand } from '../shared/desktop'\nimport type { WorkspaceSnapshot, WorkspaceState } from '../shared/workspace'\n\n/** Increment when a public contract changes incompatibly. */\nexport const ADDON_API_VERSION = 1\n\nexport type AddonManifest = {\n  id: string\n  name: string\n  description: string\n  apiVersion: typeof ADDON_API_VERSION\n  defaultEnabled?: boolean\n  /** Plugin release version; optional for existing API v1 addons. */\n  version?: string\n  authors?: readonly AddonAuthor[]\n}\n\nexport type AddonAuthor = { discordId: string; displayName: string }\n\nexport type SourceExtension = {\n  id: string\n  /** Created per source editor; may lazy-load an editor integration. */\n  create: () => Extension | Promise\u003cExtension>\n}\n\nexport type AddonCommand = {\n  /** Local id; the host prefixes it with the addon id. */\n  id: string\n  label: string\n  /** Also show this command below the workspace tree. */\n  workspace?: boolean\n  run: () => void | Promise\u003cvoid>\n}\n\nexport type ExportResult = { path: string; pages: number }\nexport type AddonState = { id: string; enabled: boolean }\n\nexport type MarkdownProjection = {\n  content: string\n  serialize: (content: string) => string\n  readOnly?: boolean\n}\nexport type MarkdownExtension = {\n  id: string\n  /** Pure source-to-body projection; return null for unrecognized documents. */\n  parse: (source: string) => MarkdownProjection | null\n  /** Optional properties UI above the rich editor. Receives the complete source. */\n  Editor?: ComponentType\u003cMarkdownEditorProps>\n}\n\nexport type MarkdownEditorProps = {\n  value: string\n  onChange: (source: string) => void\n  disabled: boolean\n}\n\nexport type AddonContext = {\n  editor: {\n    registerMarkdown: (extension: MarkdownExtension) => () => void\n    registerSource: (extension: SourceExtension) => () => void\n    /** Uses the app's file dialogs, draft checks, and save handling. */\n    runCommand: (command: DocumentCommand) => Promise\u003cboolean>\n    /** Apply a synchronous source transform to the active note; throws while busy. */\n    updateMarkdown: (transform: (source: string) => string) => void\n  }\n  commands: { register: (command: AddonCommand) => () => void }\n  workspace: {\n    get: () => Promise\u003cWorkspaceState | null>\n    open: () => Promise\u003cWorkspaceState | null>\n    openFile: (path: string) => Promise\u003cvoid>\n  }\n  /** Calls only the current addon's explicitly exported native methods. */\n  native: {\n    invoke: \u003cT = unknown>(method: string, input?: unknown) => Promise\u003cT>\n  }\n  notify: (message: string) => void\n}\n\nexport type Addon = {\n  manifest: AddonManifest\n  start: (context: AddonContext) => void\n  stop?: () => void\n  /** Optional settings content. The host supplies its heading and metadata. */\n  Settings?: ComponentType\n}\n\n/** Native modules are trusted application code, never loaded from a workspace. */\nexport type NativeAddonContext = {\n  workspace: { snapshot: () => Promise\u003cWorkspaceSnapshot> }\n  exportHtml: (\n    html: string,\n    suggestedName: string,\n    pages: number,\n  ) => Promise\u003cExportResult | null>\n}\n\nexport type NativeAddon = {\n  id: string\n  methods: Record\u003c\n    string,\n    (input: unknown, context: NativeAddonContext) => Promise\u003cunknown>\n  >\n}\n\nexport function defineAddon(addon: Addon): Addon {\n  return addon\n}\n\nexport const ADDON_CHANNELS = {\n  states: 'addons:states',\n  enable: 'addons:enable',\n  invoke: 'addons:invoke',\n} as const\n```\n","images":{}},{"path":"docs/reference/sidebar-api.md","markdown":"# shared sidebar api\n\ngenerated from `src/ui/Sidebar.tsx`. update the source, then run `npm run docs`. `npm run docs:check` rejects stale references.\n\n```typescript\nexport type SidebarItem = {\n  id: string\n  label: string\n  icon?: LucideIcon\n  children?: SidebarItem[]\n  /** Optional section label immediately before this row. */\n  section?: string\n}\nexport type SidebarProps = {\n  items: readonly SidebarItem[]\n  selected: string | null\n  onSelect: (id: string) => void\n  label: string\n  mode?: 'tree' | 'tabs'\n  open?: boolean\n  className?: string\n  idPrefix?: string\n  panelPrefix?: string\n  header?: ReactNode\n  footer?: ReactNode\n  empty?: ReactNode\n  resize?: {\n    width: number\n    maxWidth: number\n    onChange: (width: number) => void\n    onReset: () => void\n  }\n}\n```\n","images":{}},{"path":"docs/reference/theme-tokens.md","markdown":"# theme tokens\n\ngenerated from `src/ui/tokens.css`. update the source, then run `npm run docs`. `npm run docs:check` rejects stale references.\n\n```css\n/* Shared desktop and static-site theme contract. Override semantic values, not selectors. */\n:root {\n  color-scheme: light dark;\n  --background: oklch(1 0 0);\n  --surface: oklch(0.97 0 0);\n  --ink: oklch(0.24 0.008 200);\n  --muted: oklch(0.49 0.012 200);\n  --accent: oklch(0.45 0.075 200);\n  --border: oklch(0.9 0 0);\n  --overlay: oklch(0 0 0 / 0.2);\n  --font-ui: \"Geist\", sans-serif;\n  --font-mono: \"Geist Mono\", monospace;\n  --text-xs: 11px;\n  --text-sm: 12px;\n  --text-ui: 13px;\n  --text-heading: 14px;\n  --text-editor: 16px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --radius-control: 6px;\n  --radius-popover: 10px;\n  --radius-panel: 16px;\n  --control-height: 28px;\n  --sidebar-row-height: 28px;\n  --sidebar-section-height: 36px;\n  --icon-size: 16px;\n  --key-height: 20px;\n  --key-min-width: 20px;\n  --key-radius: 4px;\n  --key-background: var(--background);\n  --key-ink: var(--muted);\n  --key-border: var(--border);\n  --motion-fast: 120ms;\n  --motion-feedback: 160ms;\n  --motion-selection: 180ms;\n  --motion-pane: 240ms;\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --background: oklch(0.21 0 0);\n    --surface: oklch(0.25 0 0);\n    --ink: oklch(0.93 0.005 200);\n    --muted: oklch(0.7 0.012 200);\n    --accent: oklch(0.8 0.075 200);\n    --border: oklch(0.33 0 0);\n  }\n}\n```\n","images":{}},{"path":"docs/reference/workspace-api.md","markdown":"# workspace types\n\ngenerated from `src/shared/workspace.ts`. update the source, then run `npm run docs`. `npm run docs:check` rejects stale references.\n\n```typescript\nexport const WORKSPACE_CHANNELS = {\n  get: 'workspace:get',\n  open: 'workspace:open',\n  refresh: 'workspace:refresh',\n  openFile: 'workspace:open-file',\n  changed: 'workspace:changed',\n} as const\n\nexport type WorkspaceEntry = {\n  path: string\n  name: string\n  kind: 'file' | 'folder'\n  children?: WorkspaceEntry[]\n}\n\nexport type WorkspaceState = {\n  name: string\n  entries: WorkspaceEntry[]\n  activePath: string | null\n}\n\nexport type WorkspacePage = {\n  path: string\n  markdown: string\n  /** Local Markdown image references mapped to embedded image data URLs. */\n  images?: Record\u003cstring, string>\n}\nexport type WorkspaceSnapshot = { name: string; pages: WorkspacePage[] }\n```\n","images":{}},{"path":"docs/PRODUCT.md","markdown":"# hibi\n\n## Register\n\nproduct\n\n## Users\n\npeople writing markdown notes and documentation in local files and nested folders.\n\n## Product Purpose\n\nstart typing immediately; edit visually, in markdown, or side by side. open a folder as a workspace and export documentation as a portable static site.\n\n## Brand Personality\n\nminimal, quiet, responsive. use vscode's file navigation and codex's sidebar-aware window chrome as references.\n\n## Anti-references\n\navoid decorative panels, excess borders, large default gaps, flickering settings, and motion that repeatedly rewraps text.\n\n## Design Principles\n\n- keep writing central and secondary controls unobtrusive.\n- share navigation across settings, workspaces, and exported documentation.\n- preserve files and unsaved work through every view change.\n- use subtle motion to explain state changes.\n\n## Accessibility & Inclusion\n\nretain keyboard navigation, visible focus, labeled controls, rebindable shortcuts, and reduced-motion alternatives.\n","images":{}},{"path":"docs/README.md","markdown":"# hibi documentation\n\nhibi is a local markdown editor with folder workspaces and code-defined addons.\n\n- [editing](guides/editing.md)\n- [frontmatter addon](guides/frontmatter.md)\n- [workspaces and nested folders](guides/workspaces.md)\n- [exporting documentation](guides/exporting.md)\n- [creating addons](development/addons.md)\n- [architecture and security](development/architecture.md)\n- [shared ui and theme tokens](development/design-system.md)\n- [development and validation](development/validation.md)\n- [addon api](reference/addon-api.md)\n- [workspace types](reference/workspace-api.md)\n- [shared sidebar api](reference/sidebar-api.md)\n- [product principles](PRODUCT.md)\n","images":{}},{"path":"src/addons/documentation/README.md","markdown":"# documentation addon\n\nexports include top-bar breadcrumbs, previous/next links below a divider, and an **in this page** heading outline. the outline moves into a compact disclosure on narrower screens. phone navigation opens as a drawer with an outside-click backdrop and escape dismissal; selecting a page closes it. all navigation reuses the shared sidebar and tokens.\n\nthe first hibi addon turns a folder of markdown into one deployable HTML document.\n\nenable **documentation** under settings → addons. open a workspace, then choose **export documentation** from the sidebar or command palette. a native save dialog selects the destination. the exported site provides nested navigation, normal read-only rendering, and local fuzzy/keyword search on `cmd/ctrl+k`.\n\n`index.ts` registers the export command through the renderer SDK. `native.ts` snapshots the selected workspace, embeds escaped data into the generated site template, and uses the host’s native save operation. `manifest.ts` declares API compatibility and defaults.\n\nthe viewer uses the shared sidebar and command palette, DOMPurify, MiniSearch, and locally bundled Geist. local Markdown images are embedded from each note's folder, including absolute paths and local `file:` URLs. supported formats are PNG, JPEG, GIF, WebP, AVIF, and SVG, up to 8 mib each and 20 mib total with Markdown. remote images and other attachments are not copied. exports include in-memory edits to the current workspace document and do not save them back to disk.\n\nsee [exporting](../../../docs/guides/exporting.md) and [addon development](../../../docs/development/addons.md).\n","images":{}},{"path":"src/addons/frontmatter/README.md","markdown":"# frontmatter\n\nenabled by default; toggle it in settings → addons.\n\nnormal and split views show a collapsible properties editor above the body. text, multiline text, numbers, and booleans have editable fields. add properties with a name and type, or remove them with the row action. lists, objects, aliases, and unusual YAML values open in the yaml editor; apply validates YAML before changing the note. cancel leaves it untouched. duplicate keys are rejected. if metadata changes in markdown while a yaml draft is open, cancel and reopen it before applying.\n\nproperties use compact in-page rows: type icons and names on the left, inline values on the right, and quiet hover/focus actions. simple lists display as tags. **add property** opens a name and type row. collapsed properties animate without changing their values.\n\nuse **add frontmatter** in the command palette to create properties on a note without metadata. it preserves the body and refuses to overwrite an unclosed frontmatter block.\n\nbody edits retain metadata verbatim. field edits use the [yaml document API](https://eemeli.org/yaml/#documents) to preserve comments, value types, nested structures, and anchors. formatting inside metadata may normalize after field edits; document delimiters, line endings, surrounding spacing, and body content stay intact. invalid YAML stays untouched until explicitly repaired in the yaml editor.\n\nthe addon registers a markdown projection and optional `Editor` component through `context.editor.registerMarkdown`. its command uses `context.editor.updateMarkdown`. disabling the addon removes its UI and command, preserves the document, and leaves metadata-bearing files editable in markdown view. unsupported or unclosed blocks retain the core's source-only editing protection.\n","images":{}},{"path":"AGENTS.md","markdown":"# hibi development\n\n- keep core, renderer, shared UI, and addons separate. workspace content must never execute as addon code.\n- put documentation in markdown under `docs/`; every addon has a `README.md`.\n- update prose docs in the same change as behavior. public API changes must regenerate references with `npm run docs` and pass `npm run docs:check`.\n- preserve API compatibility; breaking SDK changes require an API version bump and addon migrations.\n- reuse the shared sidebar for settings, workspace navigation, and exported sites.\n- keep IPC narrow and validate paths in the main process. preserve unsaved edits and external-change checks.\n- validate with `npm run check`; commit progressively. keep user notes and private addons out of commits.\n","images":{}},{"path":"README.md","markdown":"# hibi\n\nminimal markdown editor built on electron 44.3.0, react, strict typescript, and electron-vite. starts with an empty, focused editor and a `start typing` placeholder. normal resizable window, integrated title area, native window controls.\n\n[documentation](docs/README.md) covers editing, folder workspaces, nested navigation, static exports, and the versioned addon API. API references are generated from their TypeScript source and checked for drift by `npm run check`.\n\nopen a folder from the left sidebar to browse nested markdown files. the documentation addon exports the workspace to one self-contained HTML file with shared sidebar navigation, read-only pages, and local fuzzy/keyword search on `cmd/ctrl+k`. addons follow a source-defined, enabled/disabled lifecycle; see [creating addons](docs/development/addons.md).\n\n## editing\n\n- **normal:** wysiwyg editing with markdown shortcuts.\n- **side-by-side:** syntax-highlighted markdown on the left and editable rich text on the right, synchronized in both directions. the divider fades to transparent at both ends.\n- **markdown only:** edit the original source directly.\n\nthe compact title bar holds file actions, filename, and view controls. editor panels fill the space below it. settings has a full-height sidebar with a flat category list: editor, appearance, hotkeys, and about. editor-only controls disappear on settings. adjust padding from 0–96 px (default 48 px), or change whether the top bar hides while typing. preferences persist across launches. use escape or the back button to return to your unchanged document.\n\nclick the centered filename or press `cmd/ctrl+k` for the command palette. search file operations, view modes, settings, and top-bar behavior. command rows show icons, categories, and individual keycaps. use arrow keys and enter to run a command, or escape to dismiss.\n\nsettings → hotkeys lets you rebind, clear, or reset app shortcuts, including view modes. click a binding, press your new shortcut, then enter to save or escape to cancel. conflicts and standard editing/window shortcuts are rejected. bindings persist in the app profile and update native menus, tooltips, and the command palette. recording a shortcut suppresses native menu actions so pressing save or close cannot accidentally execute them.\n\nopening and closing settings and the palette use short transitions. settings stays mounted and fades without capturing a screenshot of the editor. settings content changes immediately while its sidebar selection slides between rows. editor panes slide horizontally at fixed text widths: markdown enters from the left, rich text from the right. remaining content reflows once after shrinking. reduced-motion preferences disable these animations.\n\nthe markdown engine prepares during idle time and finishes font loading and its first layout before opening. hidden markdown panes pause document syncing until shown again. source compatibility checks are cached across interface changes.\n\n`cmd/ctrl+f` opens find in note at the top right. matching is literal and case-insensitive; enter/shift+enter or the arrow buttons navigate matches. escape closes it. search uses rich text in normal view, source text in markdown view, and the last focused pane in side-by-side view. search includes the full document, including markdown outside the visible viewport.\n\ngeist sans and geist mono come directly from [vercel's geist package](https://github.com/vercel/geist-font) and load from bundled woff2 files. no google fonts or font cdn requests. the font license ships in `resources/licenses/geist.txt`.\n\nstartup and lazy editor loading show a centered, faded page icon with a shimmer. reduced-motion mode shows a static icon. lucide supplies interface icons; simple-icons is installed for future brand icons and is not bundled unless used.\n\nthe flat title bar keeps its filename centered on the window. it fades out while typing and returns after 1.2 seconds idle, when the pointer moves into the top 36 px, or when its controls receive keyboard focus. its space stays reserved so text does not jump.\n\nnative file menu supports new (`cmd/ctrl+n`), open (`cmd/ctrl+o`), save (`cmd/ctrl+s`), and save as (`cmd/ctrl+shift+s`). opening another document, starting a new one, closing, or quitting asks before discarding unsaved changes. a dot beside the filename marks unsaved changes.\n\nswitching views preserves the exact markdown source. rich edits serialize markdown and may normalize spacing or syntax. html, frontmatter, reference definitions, and footnotes stay editable in source mode; rich mode becomes read-only for those documents to prevent lossy conversion. headings, emphasis, links, code, quotes, lists, task lists, and tables are supported. image references are preserved, but external and document-relative images are not loaded yet.\n\n## run\n\nuse node 24 lts (`nvm use`); node 22.18 or newer also works.\n\n```sh\nnpm ci\nnpm run dev\n```\n\n`dev` refreshes react in place and restarts electron when main or preload code changes. development binds to loopback only and uses its own `hibi-dev` profile.\n\n```sh\nnpm run check    # lint, typecheck, build, and real electron smoke tests\nnpm run package  # unpacked application in release/\nnpm run dist     # platform installer; never publishes\nnpm start        # live development with hot reload (same as npm run dev)\nnpm run preview  # launch the last production build\n```\n\non headless linux, run `xvfb-run --auto-servernum npm test`. tests keep sandboxing enabled and use a temporary profile. macos, windows, and linux checks are configured in `.github/workflows/check.yml`; hosted runs require a github repository.\n\n## boundaries\n\n- `src/main/`: window lifecycle, native menus, permission policy, local asset protocol, and privileged ipc handlers.\n- `src/preload/`: sandbox-compatible commonjs bridge. exposes individual typed operations; never exposes `ipcRenderer`, filesystem access, or a generic channel dispatcher.\n- `src/shared/`: contracts shared by main, preload, and renderer.\n- `src/renderer/`: tiptap rich editor, lazily loaded codemirror source editor, react, and css. bundled geist fonts and system light/dark mode; no node access.\n- `tests/`: asset traversal and sender checks, plus actual window launch, sandbox, csp, ipc rejection, navigation blocking, offline reload, crash recovery, and macos reopen checks. theme screenshots land in `test-results/`.\n\nproduction loads bundled content through `app://hibi/`, with a strict script content security policy. inline styles are allowed for editor layout. new windows, page navigation, downloads, and permissions are denied by default. ipc checks window identity, frame identity, and exact document url. file paths come from native dialogs, never renderer-provided paths. react render failures offer reload; renderer crashes offer reload or quit and retain the draft in the main process.\n\nfiles use utf-8 with a 2 mib limit. saves write and sync a temporary file, then rename it over the destination. existing file permissions are preserved, and changed/deleted files prompt before replacement. drafts live in memory until saved; a full app/process or machine crash is not covered by renderer-crash recovery.\n\n## keep it fast\n\nmain handles coordination; put cpu-heavy processing in an electron utility process or worker when needed. use async io. keep renderer imports small and lazy-load substantial screens. avoid background polling and synchronous ipc. react is bundled at build time, so all dependencies are development dependencies and the packaged app contains only its compiled code.\n\nelectron is pinned exactly; the lockfile makes installs repeatable. dependabot proposes upgrades weekly. vite 7 is intentional: electron-vite 5 declares support through vite 7. upgrade them together when upstream supports the next major.\n\n## before distribution\n\n`package` produces a local test build, with an ad-hoc macos signature so hardened electron binaries launch locally. configure a final app id, app icon, macos distribution signing/notarization, and windows signing before public distribution. packaging enables asar integrity checks and disables run-as-node, node environment options, and node inspector arguments.\n\ntiptap's markdown extension is marked beta upstream; versions are pinned and common markdown/gfm round trips have runnable checks. accounts, cloud sync, and an update feed are not configured. native fullscreen remains available from the view menu; startup neither maximizes nor enters fullscreen.\n\nreferences: [electron releases](https://releases.electronjs.org/), [electron security](https://www.electronjs.org/docs/latest/tutorial/security), [electron performance](https://www.electronjs.org/docs/latest/tutorial/performance), [electron-vite](https://electron-vite.org/guide/).\n","images":{}}]}</script><script>(function(){"use strict";var js={exports:{}},Gu={};var th;function x0(){if(th)return Gu;th=1;var r=Symbol.for("react.transitional.element"),i=Symbol.for("react.fragment");function c(s,f,d){var m=null;if(d!==void 0&&(m=""+d),f.key!==void 0&&(m=""+f.key),"key"in f){d={};for(var p in
